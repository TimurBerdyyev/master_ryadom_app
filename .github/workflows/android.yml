# Builds the Android app and publishes it as a GitHub release, so the site can link to
#   https://github.com/<owner>/<repo>/releases/latest/download/master-ryadom.apk
# Signing key: repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD (README.md). Push notifications: secret GOOGLE_SERVICES_JSON (the Firebase file). Without them a debug-signed APK is built — fine for a first look,
# but such builds can't be installed over each other.
name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # +100: versions built in the site repository went up to 1.0.9 (code 9); Android only installs higher codes.
      - name: Version
        run: |
          echo "APP_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx cap sync android

      - name: Firebase (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 -c "import json; d = json.load(open('android/app/google-services.json')); \
              assert any(c['client_info']['android_client_info']['package_name'] == 'kg.masterryadom.app' for c in d['client']), \
              'google-services.json is for another package'" \
              || { echo "::error::GOOGLE_SERVICES_JSON: файл не от приложения kg.masterryadom.app или повреждён"; exit 1; }
            echo "::notice::Push-уведомления включены (Firebase project $(python3 -c "import json; print(json.load(open('android/app/google-services.json'))['project_info']['project_id'])"))"
          elif [ -f android/app/google-services.json ]; then
            echo "::notice::Push-уведомления: google-services.json из репозитория"
          else
            echo "::warning::Нет GOOGLE_SERVICES_JSON — приложение собирается без push-уведомлений"
          fi

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            # Lengths and a fingerprint only (never the values) — to see which secret is wrong.
            echo "::notice::Секреты: ключ $(echo -n "$KEYSTORE_BASE64" | wc -c) символов (отпечаток $(sha256sum "$RUNNER_TEMP/release.p12" | cut -c1-16)), пароль ${#STORE_PASSWORD} символов, псевдоним ${#KEY_ALIAS} символов"
            # Check the key and passwords up front so a mistake in the secrets gives a clear message.
            if ! keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype pkcs12 -storepass "$STORE_PASSWORD" > "$RUNNER_TEMP/key.txt" 2>&1; then
              echo "::error::Ключ не открылся: проверьте ANDROID_KEYSTORE_BASE64 (весь файл целиком) и ANDROID_KEYSTORE_PASSWORD — $(tail -1 "$RUNNER_TEMP/key.txt")"
              exit 1
            fi
            if ! grep -qi "^${KEY_ALIAS}," "$RUNNER_TEMP/key.txt"; then
              echo "::error::В ключе нет псевдонима '${KEY_ALIAS}' (ANDROID_KEY_ALIAS). Есть: $(grep -i 'PrivateKeyEntry' "$RUNNER_TEMP/key.txt" | cut -d, -f1)"
              exit 1
            fi
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building a debug-signed APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Release: the APK for the site and the AAB (Android App Bundle) that Google Play requires.
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then task="assembleRelease bundleRelease"; out=release/app-release.apk
          else task=assembleDebug; out=debug/app-debug.apk; fi
          # On failure, surface Gradle's error lines as annotations (visible on the run page).
          if ! ./gradlew --no-daemon $task > "$RUNNER_TEMP/gradle.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle.log"
            # Only Gradle's "What went wrong" section (and compiler errors), not the task list.
            { sed -n '/What went wrong/,/\* Try:/p' "$RUNNER_TEMP/gradle.log"; grep -E "^e: |error:|AAPT: error" "$RUNNER_TEMP/gradle.log"; } \
              | grep -v -E "^\* Try:|^$" | head -20 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/gradle.log"
          cp "app/build/outputs/apk/$out" "$GITHUB_WORKSPACE/master-ryadom.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/master-ryadom.aab"
          fi
          ls -la "$GITHUB_WORKSPACE/master-ryadom.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: master-ryadom-${{ env.APP_VERSION_NAME }}
          path: |
            master-ryadom.apk
            master-ryadom.aab
          if-no-files-found: warn

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="master-ryadom.apk"
          [ -f master-ryadom.aab ] && files="$files master-ryadom.aab"
          gh release create "android-v${APP_VERSION_NAME}" $files \
            --title "Мастер рядом для Android ${APP_VERSION_NAME}" \
            --notes "Установка: скачайте master-ryadom.apk на телефон и откройте файл. Для Google Play — master-ryadom.aab (Play Console → Выпуск → Создать выпуск). Подпись: ${{ steps.key.outputs.signed == 'true' && 'release' || 'debug (тестовая)' }}." \
            --latest
